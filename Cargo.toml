[package]
name = "fractal3D"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.17.3"
bevy_egui = "0.38.1"

# Keep our own code quick to rebuild while running Bevy and egui optimized in dev builds
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Web build, optimized for size to stay under Cloudflare's 25 MiB per-asset limit
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
strip = true
panic = "abort"
