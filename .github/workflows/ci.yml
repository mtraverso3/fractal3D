name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint

      # Bevy's native dependencies for audio, input and windowing on Linux
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Format
        run: cargo fmt --check

      - name: Clippy (desktop)
        run: cargo clippy -- -D warnings

      - name: Clippy (web)
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-web

      # Also fails if the wasm grows past Cloudflare's 25 MiB asset limit
      - name: Build
        run: bash web/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          retention-days: 7

  # Single required status for branch protection
  ci:
    name: CI
    if: always()
    needs: [lint, web]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Uploads the build as a Worker version with a per-PR preview URL, without touching
  # production. Fork PRs have no access to the Cloudflare secrets, so they are skipped.
  preview:
    needs: web
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      MARKER: "<!-- web-preview -->"
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: wrangler.jsonc
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist

      - name: Upload preview version
        id: upload
        run: |
          # Versions can only be uploaded once the Worker exists, i.e. after the first
          # production deploy from main
          if ! npx -y wrangler@4 deployments list > deployments.log 2>&1; then
            if grep -q "code: 10007" deployments.log; then
              echo "::notice::The Worker has not been deployed yet, skipping the preview"
              exit 0
            fi
            cat deployments.log
            exit 1
          fi
          npx -y wrangler@4 versions upload --preview-alias "pr-$PR" \
            --message "PR #$PR at ${GITHUB_SHA::7}" | tee upload.log
          url=$(grep -o "https://pr-$PR-[^ ]*workers\.dev" upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview link
        if: steps.upload.outputs.url != ''
        env:
          URL: ${{ steps.upload.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="$MARKER
          **Web preview:** $URL

          Built from ${SHA::7}. Updates on every push to this PR."
          comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi
