name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "wrangler.jsonc"
      - ".github/actions/setup-web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

# Never run two deploys at once, but let a running deploy finish
concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Build and deploy are separate jobs so a failed deploy can be re-run on its own
# ("Re-run failed jobs") without rebuilding
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-web

      - name: Build
        run: bash web/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fractal.mtraverso.net
    steps:
      # Only the wrangler config is needed here
      - uses: actions/checkout@v7
        with:
          sparse-checkout: wrangler.jsonc
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
