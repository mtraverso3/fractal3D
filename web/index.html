<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>fractal3D</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #bevy {
            width: 100%;
            height: 100%;
            display: block;
        }
        .links {
            position: fixed;
            bottom: 10px;
            right: 10px;
            font-family: sans-serif;
            font-size: 14px;
            z-index: 1000;
        }
        .links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            margin-left: 15px;
            transition: color 0.2s;
        }
        .links a:hover {
            color: #fff;
        }
    </style>
</head>
<body>
    <canvas id="bevy"></canvas>
    <div class="links">
        <a href="https://github.com/mtraverso3/fractal3D" target="_blank">Source Code</a>
        <a href="https://mtraverso.net" target="_blank">mtraverso.net</a>
    </div>
    <script type="module">
        import init from './fractal3D.js'

        // winit throws this on purpose to hand control to the browser's event loop
        init().catch((error) => {
            if (!error.message.startsWith("Using exceptions for control flow, don't mind me. This isn't actually an error!")) {
                throw error;
            }
        });
    </script>
</body>
</html>
